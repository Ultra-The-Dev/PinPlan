version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Few, bundled PRs: each one also gets a Vercel preview (skipped for dependabot/* branches in vercel.json).
    open-pull-requests-limit: 3
    groups:
      # Everything that isn't a major version, in one PR a month.
      minor-and-patch:
        update-types: ["minor", "patch"]
      # Upgrade together: mismatched versions break the build or the tests.
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      playwright:
        patterns: ["@playwright/test", "@axe-core/playwright"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      dev-minor:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Major versions are done by hand and tested (e.g. ESLint 10 needs eslint-config-next support first).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The PDF.js worker file is versioned with the app build; bump it by hand and test plan import.
      - dependency-name: pdfjs-dist
        update-types: ["version-update:semver-major"]

  # Workflow actions, including the SHA-pinned third-party ones (the version comment after the SHA is kept updated).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
