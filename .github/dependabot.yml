version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Upgrade together: mismatched versions break the build or the tests.
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      playwright:
        patterns: ["@playwright/test", "@axe-core/playwright"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      dev-minor:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # The PDF.js worker file is versioned with the app build; bump it by hand and test plan import.
      - dependency-name: pdfjs-dist
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
