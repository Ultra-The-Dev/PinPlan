name: iOS TestFlight

# Archives the app, signs it for the App Store and uploads it to App Store Connect (TestFlight). Runs by itself on
# every push to the release branch that changes the app (ios/**), from Actions → iOS TestFlight → Run workflow, or
# for a tag like `ios-v1.0.1` (the part after "ios-v" becomes the version). Until the Apple secrets below are set, a
# push run just says so and stops (no failure). The build number is this workflow's run number, so every upload is
# newer than the last; the app's "new version" banner reads it back (/api/ios/latest, docs/testflight.md).
# Uploads are for internal testers only (your own App Store Connect team): nothing is ever public from here.
#
# Environment secrets of `appstore` (Settings → Environments → appstore):
#   APPLE_TEAM_ID   your Apple Developer team ID (10 characters)
#   ASC_KEY_ID      App Store Connect API key ID (Users and Access → Integrations → App Store Connect API, role App Manager)
#   ASC_ISSUER_ID   the issuer ID shown on that page
#   ASC_KEY_P8      the contents of the downloaded AuthKey_XXXX.p8 file
# Repository variables (optional):
#   PINPLAN_SERVER_URL  the web app's address (default https://northpin.app), built into the app
#   IOS_BUNDLE_ID       the app's bundle ID if it isn't the one in ios/project.yml (app.northpin.ios)
on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]
    branches: ["claude/quirky-clarke-gjz5h1"]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml"]

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    # The signing secrets are Environment secrets of `appstore` (Settings → Environments), limited to the branches
    # and tags allowed to release (docs/launch-checklist.md §10.4).
    environment: appstore
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      PINPLAN_SERVER_URL: ${{ vars.PINPLAN_SERVER_URL || 'https://northpin.app' }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Xcode 26
        run: |
          # App Store Connect rejects uploads built with a beta or RC Xcode, so pick the newest release one.
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No release Xcode 26 on this runner."; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Check signing setup
        id: ready
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "Missing secret $name (see the top of ios-testflight.yml and docs/testflight.md)."; missing=1; fi
          done
          case "$PINPLAN_SERVER_URL" in
            https://*) ;;
            *) echo "PINPLAN_SERVER_URL must be an https:// address."; missing=1 ;;
          esac
          if [ $missing = 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=false" >> "$GITHUB_OUTPUT"
          # A push before TestFlight is set up isn't an error; a run started by hand is.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::notice::TestFlight isn't set up yet (docs/testflight.md), so nothing was uploaded."; exit 0
          fi
          echo "::error::TestFlight isn't set up yet: add the Apple secrets (docs/testflight.md)."; exit 1
      - name: Version
        if: steps.ready.outputs.go == 'true'
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then echo "marketing=${GITHUB_REF_NAME#ios-v}" >> "$GITHUB_OUTPUT"; fi
      - run: brew install xcodegen
        if: steps.ready.outputs.go == 'true'
      - name: PinPlanCore tests
        if: steps.ready.outputs.go == 'true'
        working-directory: ios/PinPlanCore
        run: swift test
      - name: App Store Connect key
        if: steps.ready.outputs.go == 'true'
        env:
          # Only this step sees the private key; later steps use the file (removed at the end).
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Archive
        if: steps.ready.outputs.go == 'true'
        working-directory: ios
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
        run: |
          set -o pipefail
          xcodegen generate
          EXTRA=()
          if [ -n "$MARKETING" ]; then EXTRA+=(MARKETING_VERSION="$MARKETING"); fi
          if [ -n "$IOS_BUNDLE_ID" ]; then EXTRA+=(PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"); fi
          xcodebuild -project PinPlan.xcodeproj -scheme PinPlan -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PinPlan.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" PINPLAN_SERVER_URL="$PINPLAN_SERVER_URL" "${EXTRA[@]}" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Upload to TestFlight
        if: steps.ready.outputs.go == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          cp ExportOptions.plist build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/PinPlan.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log
          echo "Uploaded build $BUILD_NUMBER. It shows in App Store Connect → TestFlight after processing (about 10–30 minutes)."
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/upload.log
          if-no-files-found: ignore
