name: Apply database migration

# Applies ONE migration file from supabase/migrations to the production Supabase database through the Supabase
# Management API, then prints schema_version(). Manual only. Needs the SUPABASE_ACCESS_TOKEN secret (a personal access
# token; give it a short expiry and delete it when done) and the NEXT_PUBLIC_SUPABASE_URL variable (the project ref is
# read from it). Migrations are written to be safe to run twice.
on:
  workflow_dispatch:
    inputs:
      migration:
        description: "File name in supabase/migrations (e.g. 20261125002100_online_payments.sql)"
        required: true
      confirm:
        description: 'Type "apply" to change the production database'
        required: true

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          MIGRATION: ${{ inputs.migration }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "apply" ] || { echo "::error::Type apply to confirm."; exit 1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN isn't set."; exit 1; }
          case "$MIGRATION" in *[!A-Za-z0-9_.-]*|"") echo "::error::Bad file name."; exit 1;; esac
          FILE="supabase/migrations/$MIGRATION"
          [ -f "$FILE" ] || { echo "::error::$FILE not found."; exit 1; }
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([a-z0-9]+)\.supabase\.co.*#\1#')
          [ -n "$REF" ] && [ "$REF" != "$SUPABASE_URL" ] || { echo "::error::Can't read the project ref from NEXT_PUBLIC_SUPABASE_URL."; exit 1; }
          api() {
            jq -n --arg q "$1" '{query: $q}' | curl -sS -m 120 -w '\n%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @-
          }
          echo "Before: $(api 'select public.schema_version()' | head -1)"
          OUT=$(api "$(cat "$FILE")")
          CODE=$(printf '%s' "$OUT" | tail -1)
          echo "Apply $MIGRATION: HTTP $CODE"
          printf '%s\n' "$OUT" | head -c 2000; echo
          [ "$CODE" = "201" ] || [ "$CODE" = "200" ] || { echo "::error::The migration failed."; exit 1; }
          echo "After: $(api 'select public.schema_version()' | head -1)"
