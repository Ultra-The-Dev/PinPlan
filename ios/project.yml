# XcodeGen spec. Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen
name: PinPlan
options:
  bundleIdPrefix: com.pinplan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # English is the source language; Russian comes from the String Catalogs (PinPlan/*.xcstrings). The app follows
  # the device language (Settings › PinPlan › Language on iOS), there is no in-app switch.
  developmentLanguage: en
packages:
  PinPlanCore:
    path: PinPlanCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    # The version people see, and the build number. CI sets CURRENT_PROJECT_VERSION to the run number for TestFlight.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The PinPlan web server the app talks to (sign-in setup, Billdu, terms / privacy / support pages). Empty here;
    # release builds pass it on the command line (PINPLAN_SERVER_URL=https://…, see .github/workflows/ios-testflight.yml).
    # In an .xcconfig write it as https:/$()/your-server because "//" starts a comment there.
    PINPLAN_SERVER_URL: ""
    # The Apple team is never committed: pass DEVELOPMENT_TEAM=… to xcodebuild, or pick it in Xcode › Signing.
targets:
  PinPlan:
    type: application
    platform: iOS
    sources:
      - path: PinPlan
        excludes: ["PrivacyInfo.xcprivacy"]
      # Privacy manifest (App Store): required-reason APIs and the data the app collects. Copied as a resource.
      - path: PinPlan/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: PinPlanCore
    info:
      path: PinPlan/Info.plist
      properties:
        # Plain-http only for the local network (a test server on this machine); everything else stays HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only standard HTTPS (exempt): no export-compliance documents needed in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # Version and build number come from the build settings above (CI bumps the build number per upload).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Read by AppSettings.builtInServerURL: a fresh install goes straight to email + password.
        PinPlanServerURL: "$(PINPLAN_SERVER_URL)"
        # Languages the app ships (String Catalogs: Localizable, Labels, InfoPlist). Lets iOS offer Russian per app.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF plan
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Plan image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg, public.png, public.heic, public.tiff, public.image]
          - CFBundleTypeName: PinPlan backup
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinplan.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PinPlan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "PinPlan uses the camera to scan paper plan sets into a job and to take job-site photos that are saved with the job."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PinPlan lets you pick plan photos and job-site photos from your library to add them to a job. Only the photos you choose are used."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "PinPlan saves where a job-site photo was taken with the photo and shows your jobs on the map. You can turn this off with Stamp location on a job's Photos tab."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Compile the String Catalogs and keep their keys in sync with the code when building in Xcode.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  PinPlan:
    build:
      targets:
        PinPlan: all
