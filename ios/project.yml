# XcodeGen spec. Generate the Xcode project with:  brew install xcodegen && cd ios && xcodegen
name: PinPlan
options:
  bundleIdPrefix: com.pinplan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PinPlanCore:
    path: PinPlanCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PinPlan:
    type: application
    platform: iOS
    sources:
      - path: PinPlan
    dependencies:
      - package: PinPlanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinplan.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PinPlan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "PinPlan uses the camera to scan paper plans and photograph device locations."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PinPlan imports plan photos from your library."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
schemes:
  PinPlan:
    build:
      targets:
        PinPlan: all
